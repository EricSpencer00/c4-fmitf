CONSTANTS
  ROWS = 6
  COLS = 7
  PLAYERS = {1, 2}
  ROWS_SET = {1, 2, 3, 4, 5, 6}
  COLS_SET = {1, 2, 3, 4, 5, 6, 7}

SPECIFICATION SpecWithFairness

INVARIANT TypeOK
INVARIANT ValidGameState
INVARIANT StateSpaceReduction
INVARIANT NoImpossiblePositions

# Optionally constrain moveCount for bounded checking
CONSTRAINT moveCount <= 12

# View variables for easier trace inspection
VIEW board, gameOver, moveCount