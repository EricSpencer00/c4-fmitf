SPECIFICATION SpecWithFairness

CONSTANTS
    ROWS = 6
    COLS = 7
    PLAYERS = {1, 2}
    ROW_SET = {1, 2, 3, 4, 5, 6}
    COL_SET = {1, 2, 3, 4, 5, 6, 7}

INVARIANT
    TypeOK
    ValidGameState  
    StateSpaceReduction
    NoImpossiblePositions

PROPERTIES
    Termination
    Reachable

\* Bounded model checking for performance
CONSTRAINT  
    moveCount <= 12

\* Init constraint for symmetry breaking
INIT_NEXT_VAR
    board'

\* Apalache-specific optimizations
SYMMETRY
    Permutations(PLAYERS)

VIEW
    <<board, gameOver, moveCount>>