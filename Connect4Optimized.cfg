SPECIFICATION Spec

CONSTANTS
    ROWS = 6
    COLS = 7  
    WIN_LENGTH = 4

INVARIANT
    TypeInvariant
    MaximalReduction
    ValidStates
    StateReachability
    GameCorrectness

PROPERTIES
    GameEnds
    SpaceEfficiency

\* Bounded exploration for feasibility
CONSTRAINT
    moveCount <= 15

\* Symmetry breaking for Apalache
SYMMETRY
    Permutations({1, 2})

VIEW
    <<packedBoard, moveCount, Cardinality(visitedStates)>>